<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="phone-frame">
  <div class="screens">

    <!-- SCREEN 1: PHONE LOGIN -->
    <section class="screen" id="screen-phone" data-active="true">
      <div class="screen-top">
        <div class="brand-badge">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 6V11C4 16 7.5 20.5 12 22C16.5 20.5 20 16 20 11V6L12 2Z" fill="white" fill-opacity="0.95"/>
            <path d="M9 12.5L11 14.5L15.5 10" stroke="#5a20d0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="screen-body">
        <h1 class="title">Welcome back!</h1>
        <p class="subtitle">Log in to your account</p>

        <form id="phone-form" class="form" novalidate>
          <label class="field-label" for="phone-input">Mobile number</label>
          <div class="phone-row">
            <button type="button" class="country-select" id="country-select" aria-haspopup="listbox">
              <span class="flag" aria-hidden="true">
                <svg width="22" height="16" viewBox="0 0 36 24" xmlns="http://www.w3.org/2000/svg">
                  <rect width="36" height="8" y="0" fill="#FF9933"/>
                  <rect width="36" height="8" y="8" fill="#FFFFFF"/>
                  <rect width="36" height="8" y="16" fill="#138808"/>
                  <circle cx="18" cy="12" r="3" fill="none" stroke="#000080" stroke-width="0.6"/>
                </svg>
              </span>
              <span class="dial-code">+91</span>
              <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="divider-vert" aria-hidden="true"></div>
            <input
              type="tel"
              id="phone-input"
              class="phone-input"
              inputmode="numeric"
              placeholder="98765 43210"
              maxlength="10"
              autocomplete="tel-national"
              aria-label="Mobile number"
            />
          </div>
          <p class="field-error" id="phone-error" role="alert"></p>

          <button type="submit" class="btn-primary" id="send-otp-btn">
            <span class="btn-label">Get a Code</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>

          <p class="legal-text">
            By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
          </p>
        </form>
      </div>
    </section>

    <!-- SCREEN 2: OTP VERIFICATION -->
    <section class="screen" id="screen-otp" data-active="false">
      <div class="screen-body">
        <button type="button" class="back-btn" id="back-btn" aria-label="Go back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <h1 class="title">Enter authorization code</h1>
        <p class="subtitle">
          Enter the 6-digit code we sent to
          <span class="phone-chip" id="sent-to-number">+91 98765 43210</span>
        </p>

        <div class="otp-row" id="otp-row">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" data-index="0" autocomplete="one-time-code" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" data-index="1" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" data-index="2" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" data-index="3" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" data-index="4" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" data-index="5" />
        </div>
        <p class="field-error" id="otp-error" role="alert"></p>

        <div class="resend-row">
          <span id="resend-static">Get new code in</span>
          <span class="resend-timer" id="resend-timer">24s</span>
          <button type="button" class="resend-btn" id="resend-btn" disabled>Resend code</button>
        </div>

        <button type="button" class="btn-primary" id="verify-btn" disabled>
          <span class="btn-label">Continue</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

        <!-- On-screen numeric keypad -->
        <div class="keypad" id="keypad">
          <button type="button" class="key" data-key="1">1</button>
          <button type="button" class="key" data-key="2">2<span>ABC</span></button>
          <button type="button" class="key" data-key="3">3<span>DEF</span></button>
          <button type="button" class="key" data-key="4">4<span>GHI</span></button>
          <button type="button" class="key" data-key="5">5<span>JKL</span></button>
          <button type="button" class="key" data-key="6">6<span>MNO</span></button>
          <button type="button" class="key" data-key="7">7<span>PQRS</span></button>
          <button type="button" class="key" data-key="8">8<span>TUV</span></button>
          <button type="button" class="key" data-key="9">9<span>WXYZ</span></button>
          <button type="button" class="key key-empty" tabindex="-1" aria-hidden="true"></button>
          <button type="button" class="key" data-key="0">0</button>
          <button type="button" class="key key-del" data-key="del" aria-label="Delete">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 6h10a2 2 0 012 2v8a2 2 0 01-2 2H9l-6-6 6-6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 10l4 4M17 10l-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </section>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
