<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile Setup</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="topbar">
      <a href="index.html" class="back-btn" aria-label="Go Back">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </a>

      <h1>Profile Setup</h1>
    </header>


    <!-- Profile Form -->
    <section class="profile-section">

      <div class="profile-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="3.5"
                  stroke="currentColor"
                  stroke-width="1.8"/>
          <path d="M5 20C5.8 16.5 8.1 14.5 12 14.5C15.9 14.5 18.2 16.5 19 20"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"/>
        </svg>
      </div>

      <h2>Complete Your Profile</h2>

      <p class="subtitle">
        Add your basic information to set up your profile.
      </p>


      <form id="profileForm">

        <!-- First Name -->
        <div class="form-group">
          <label for="firstName">First Name</label>

          <div class="input-box">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20 21C20 17.7 16.4 15 12 15C7.6 15 4 17.7 4 21"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"/>
              <circle cx="12" cy="7" r="4"
                      stroke="currentColor"
                      stroke-width="1.8"/>
            </svg>

            <input
              type="text"
              id="firstName"
              placeholder="Enter your first name"
              autocomplete="given-name"
            >
          </div>

          <small class="error" id="firstNameError"></small>
        </div>


        <!-- Last Name -->
        <div class="form-group">
          <label for="lastName">Last Name</label>

          <div class="input-box">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20 21C20 17.7 16.4 15 12 15C7.6 15 4 17.7 4 21"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"/>
              <circle cx="12" cy="7" r="4"
                      stroke="currentColor"
                      stroke-width="1.8"/>
            </svg>

            <input
              type="text"
              id="lastName"
              placeholder="Enter your last name"
              autocomplete="family-name"
            >
          </div>

          <small class="error" id="lastNameError"></small>
        </div>


        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>

          <div class="input-box">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="2"
                    stroke="currentColor"
                    stroke-width="1.8"/>
              <path d="M4 7L12 13L20 7"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
            </svg>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              autocomplete="email"
            >
          </div>

          <small class="error" id="emailError"></small>
        </div>


        <!-- Submit -->
        <button type="submit" class="submit-btn">
          <span>Save Profile</span>

          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 12H19"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"/>
            <path d="M13 6L19 12L13 18"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
        </button>

      </form>


      <!-- Success -->
      <div class="success-box" id="successBox">
        <div class="success-icon">
          ✓
        </div>

        <div>
          <strong>Profile Saved!</strong>
          <p>Your profile information has been saved successfully.</p>
        </div>
      </div>

    </section>

  </main>

  <script src="profile.js"></script>

</body>
</html>
