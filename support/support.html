<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Support | My Recharge App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="support-topbar">

      <div class="support-topbar__row">

        <a
          href="../index.html"
          class="support-back icon-btn"
          data-ripple
          aria-label="Back to Home"
        >
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </a>

        <h1>Support</h1>

        <div class="support-topbar__space"></div>

      </div>

    </header>


    <!-- =========================
         CONTENT
    ========================== -->
    <main class="support-content">

      <!-- Hero -->
      <section class="support-hero">

        <div class="support-hero__image">

          <!-- Customer support illustration -->
          <svg
            class="support-hero__svg"
            viewBox="0 0 180 180"
            aria-hidden="true"
          >
            <circle
              cx="90"
              cy="90"
              r="78"
              fill="#efe9ff"
            />

            <circle
              cx="90"
              cy="78"
              r="30"
              fill="#8352f0"
            />

            <path
              d="M43 119c8-27 26-40 47-40s39 13 47 40"
              fill="#6d31e0"
            />

            <path
              d="M53 77c0-24 16-43 37-43s37 19 37 43"
              fill="none"
              stroke="#3a1590"
              stroke-width="8"
              stroke-linecap="round"
            />

            <rect
              x="43"
              y="72"
              width="17"
              height="32"
              rx="8"
              fill="#5a24c9"
            />

            <rect
              x="130"
              y="72"
              width="17"
              height="32"
              rx="8"
              fill="#5a24c9"
            />

            <path
              d="M138 104c-4 15-15 23-30 23"
              fill="none"
              stroke="#3a1590"
              stroke-width="5"
              stroke-linecap="round"
            />

            <circle
              cx="108"
              cy="127"
              r="6"
              fill="#16a34a"
            />

            <circle
              cx="79"
              cy="75"
              r="4"
              fill="#fff"
            />

            <circle
              cx="101"
              cy="75"
              r="4"
              fill="#fff"
            />

            <path
              d="M78 89c7 6 16 6 23 0"
              fill="none"
              stroke="#fff"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>

        </div>

        <h2>We're here to help you 24/7.</h2>

        <p>
          Need help with your recharge or have any questions?
          Our support team is always here for you.
        </p>

      </section>


      <!-- =========================
           WHATSAPP SUPPORT
      ========================== -->
      <section class="support-card">

        <div class="support-card__heading">

          <div class="support-card__icon support-card__icon--whatsapp">

            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20 11.5a8.5 8.5 0 0 1-12.7 7.4L4 20l1.2-3.2A8.5 8.5 0 1 1 20 11.5Z"
              />

              <path
                d="M8.5 8.5c.3-.6.6-.6 1-.6h.5c.2 0 .4.1.5.4l.7 1.7c.1.3.1.5-.1.7l-.5.6c.5 1 1.3 1.8 2.3 2.3l.6-.5c.2-.2.4-.2.7-.1l1.7.7c.3.1.4.3.4.5v.5c0 .4 0 .7-.6 1-1.1.5-2.6-.1-4.2-1.2-1.5-1.1-2.7-2.5-3.1-3.8-.4-1.1-.4-1.8.1-2.2Z"
                fill="currentColor"
                stroke="none"
              />
            </svg>

          </div>

          <div class="support-card__info">
            <h3>WhatsApp Support</h3>
            <p>9735101057</p>
          </div>

        </div>


        <a
          href="https://wa.me/9735101057"
          class="support-action support-action--whatsapp"
          data-ripple
        >

          <span>Start Chat</span>

          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="M13 6l6 6-6 6"/>
          </svg>

        </a>

      </section>


      <!-- =========================
           MOBILE CALL
      ========================== -->
      <section class="support-card">

        <div class="support-card__heading">

          <div class="support-card__icon support-card__icon--phone">

            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6.5 3.5h3l1.5 5-2 1.5a14 14 0 0 0 5 5l1.5-2 5 1.5v3c0 1-1 1.5-2 1.5C10.5 19 5 13.5 5 5.5c0-1 .5-2 1.5-2Z"
              />
            </svg>

          </div>

          <div class="support-card__info">
            <h3>Mobile Call</h3>
            <p>9735101057</p>
          </div>

        </div>


        <a
          href="tel:+919735101057"
          class="support-action support-action--call"
          data-ripple
        >

          <span>Call Now</span>

          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M6.5 3.5h3l1.5 5-2 1.5a14 14 0 0 0 5 5l1.5-2 5 1.5v3c0 1-1 1.5-2 1.5C10.5 19 5 13.5 5 5.5c0-1 .5-2 1.5-2Z"
            />
          </svg>

        </a>

      </section>

    </main>


    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->
    <nav class="bottom-nav" aria-label="Primary">

      <!-- HOME -->
      <a
        class="nav__item"
        href="../index.html"
        data-ripple
      >
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 11L12 4l8.5 7"/>
          <path d="M6 9.5V20h12V9.5"/>
          <path d="M10 20v-5h4v5"/>
        </svg>

        <span>Home</span>
      </a>


      <!-- HISTORY -->
      <a
        class="nav__item"
        href="../history/history.html"
        data-ripple
      >
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 12a8.5 8.5 0 102.6-6.1L3.5 8.5"/>
          <path d="M3.5 4v4.5H8"/>
          <path d="M12 8v4.5l3 1.8"/>
        </svg>

        <span>History</span>
      </a>


      <!-- SUPPORT - ACTIVE -->
      <a
        class="nav__item is-active"
        href="support.html"
        aria-current="page"
        data-ripple
      >
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 14v-2a8 8 0 0116 0v2"/>
          <rect x="3" y="14" width="4.5" height="6" rx="2"/>
          <rect x="16.5" y="14" width="4.5" height="6" rx="2"/>
          <path d="M19 20c0 1.2-1.5 2-4 2h-2"/>
        </svg>

        <span>Support</span>
      </a>


      <!-- SETTINGS -->
      <a
        class="nav__item"
        href="settings.html"
        data-ripple
      >
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/>
          <circle cx="16" cy="7" r="2.2"/>
          <circle cx="8" cy="17" r="2.2"/>
        </svg>

        <span>Settings</span>
      </a>

    </nav>

  </div>


  <script src="script.js"></script>

</body>
</html>
