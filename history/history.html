<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>History | My Recharge App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="history.css">
</head>

<body>

  <div class="app">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="history-topbar">

      <div class="history-topbar__row">

        <a
          href="/portal/index.html"
          class="icon-btn"
          data-ripple
          aria-label="Back to Home"
        >
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </a>

        <h1>History</h1>

        <button
          class="icon-btn"
          id="clearSearch"
          data-ripple
          aria-label="Clear search"
          type="button"
        >
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12"/>
            <path d="M18 6L6 18"/>
          </svg>
        </button>

      </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="history-content">

      <!-- =========================
           SUMMARY
      ========================== -->
      <section class="history-summary">

        <div class="summary-card">

          <div class="summary-card__icon">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 12a8.5 8.5 0 102.6-6.1L3.5 8.5"/>
              <path d="M3.5 4v4.5H8"/>
              <path d="M12 8v4.5l3 1.8"/>
            </svg>
          </div>

          <div>
            <span>Total Transactions</span>
            <strong id="totalTransactions">0</strong>
          </div>

        </div>


        <div class="summary-card">

          <div class="summary-card__icon summary-card__icon--green">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12l4 4L19 6"/>
            </svg>
          </div>

          <div>
            <span>Successful</span>
            <strong id="successfulTransactions">0</strong>
          </div>

        </div>

      </section>


      <!-- =========================
           SEARCH
      ========================== -->
      <section class="history-search">

        <div class="search-box">

          <svg class="ico search-box__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"/>
            <path d="m16 16 5 5"/>
          </svg>

          <input
            type="search"
            id="historySearch"
            placeholder="Search transactions..."
            autocomplete="off"
          >

          <button
            type="button"
            id="searchClear"
            class="search-clear"
            aria-label="Clear search"
          >
            <svg class="ico" viewBox="0 0 24 24">
              <path d="M6 6l12 12"/>
              <path d="M18 6L6 18"/>
            </svg>
          </button>

        </div>

      </section>


      <!-- =========================
           FILTERS
      ========================== -->
      <section class="filter-section">

        <div class="filter-scroll">

          <button
            class="filter-btn is-active"
            data-filter="all"
            type="button"
          >
            All
          </button>

          <button
            class="filter-btn"
            data-filter="recharge"
            type="button"
          >
            Recharge
          </button>

          <button
            class="filter-btn"
            data-filter="payment"
            type="button"
          >
            Payment
          </button>

          <button
            class="filter-btn"
            data-filter="add-money"
            type="button"
          >
            Add Money
          </button>

        </div>

      </section>


      <!-- =========================
           HISTORY LIST
      ========================== -->
      <section class="history-section">

        <div class="history-heading">

          <div>
            <h2>Recent Transactions</h2>
            <p id="resultText">Your latest activity</p>
          </div>

          <button
            class="sort-btn"
            id="sortButton"
            type="button"
            data-ripple
            aria-label="Sort transactions"
          >
            <svg class="ico" viewBox="0 0 24 24">
              <path d="M8 5v14"/>
              <path d="m5 8 3-3 3 3"/>
              <path d="M16 19V5"/>
              <path d="m13 16 3 3 3-3"/>
            </svg>
          </button>

        </div>


        <!-- Dynamic history list -->
        <div
          class="history-list"
          id="historyList"
        ></div>


        <!-- Empty state -->
        <div
          class="empty-history"
          id="emptyHistory"
          hidden
        >

          <div class="empty-history__image">

            <svg viewBox="0 0 180 160" aria-hidden="true">

              <rect
                x="36"
                y="27"
                width="108"
                height="104"
                rx="18"
                fill="#efe9ff"
              />

              <rect
                x="52"
                y="45"
                width="76"
                height="10"
                rx="5"
                fill="#d9ccfa"
              />

              <rect
                x="52"
                y="68"
                width="60"
                height="9"
                rx="4"
                fill="#d9ccfa"
              />

              <rect
                x="52"
                y="89"
                width="68"
                height="9"
                rx="4"
                fill="#d9ccfa"
              />

              <circle
                cx="127"
                cy="119"
                r="25"
                fill="#7c3aed"
              />

              <path
                d="M119 119h16"
                stroke="#fff"
                stroke-width="4"
                stroke-linecap="round"
              />

              <path
                d="M127 111v16"
                stroke="#fff"
                stroke-width="4"
                stroke-linecap="round"
              />

            </svg>

          </div>

          <h3>No History Found</h3>

          <p>
            Your recharge and payment transactions
            will appear here.
          </p>

        </div>

      </section>

    </main>


    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->
    <nav class="bottom-nav" aria-label="Primary">

      <!-- HOME -->
      <a
        class="nav__item"
        href="/portal/index.html"
        data-ripple
      >
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 11L12 4l8.5 7"/>
          <path d="M6 9.5V20h12V9.5"/>
          <path d="M10 20v-5h4v5"/>
        </svg>

        <span>Home</span>
      </a>


      <!-- HISTORY ACTIVE -->
      <a
        class="nav__item is-active"
        href="history.html"
        aria-current="page"
        data-ripple
      >
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 12a8.5 8.5 0 102.6-6.1L3.5 8.5"/>
          <path d="M3.5 4v4.5H8"/>
          <path d="M12 8v4.5l3 1.8"/>
        </svg>

        <span>History</span>
      </a>


      <!-- SUPPORT -->
      <a
        class="nav__item"
        href="../support/support.html"
        data-ripple
      >
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 14v-2a8 8 0 0116 0v2"/>
          <rect x="3" y="14" width="4.5" height="6" rx="2"/>
          <rect x="16.5" y="14" width="4.5" height="6" rx="2"/>
          <path d="M19 20c0 1.2-1.5 2-4 2h-2"/>
        </svg>

        <span>Support</span>
      </a>


      <!-- SETTINGS -->
      <a
        class="nav__item"
        href="settings.html"
        data-ripple
      >
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/>
          <circle cx="16" cy="7" r="2.2"/>
          <circle cx="8" cy="17" r="2.2"/>
        </svg>

        <span>Settings</span>
      </a>

    </nav>

  </div>


  <script src="history.js"></script>

</body>
</html>
